<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macro Stock Analyzer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif; background: #0f172a; color: #e2e8f0; }
      #root { min-height: 100vh; }
      #app-loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      }
      .loading-logo { font-size: 64px; margin-bottom: 24px; animation: pulse-logo 2s ease-in-out infinite; }
      @keyframes pulse-logo { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.08); opacity: 0.85; } }
      .loading-title { font-size: 28px; font-weight: 700; color: #f8fafc; margin-bottom: 8px; letter-spacing: -0.5px; }
      .loading-subtitle { font-size: 14px; color: #94a3b8; margin-bottom: 32px; }
      .loading-spinner {
        width: 48px; height: 48px;
        border: 4px solid #334155;
        border-top: 4px solid #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .loading-status { margin-top: 20px; font-size: 13px; color: #64748b; }
      .loading-bar-track {
        width: 200px; height: 4px; background: #334155; border-radius: 2px;
        margin-top: 16px; overflow: hidden;
      }
      .loading-bar-fill {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #3b82f6, #6366f1);
        border-radius: 2px;
        animation: load-progress 2s ease-in-out infinite;
      }
      @keyframes load-progress {
        0% { width: 10%; } 50% { width: 70%; } 100% { width: 95%; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CnX-yVIb.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-EBpiXGt4.css">
  </head>
  <body>
    <div id="root">
      <div id="app-loading-screen">
        <div class="loading-logo">📊</div>
        <div class="loading-title">Macro Stock Analyzer</div>
        <div class="loading-subtitle">실시간 시세 기반 · 매크로 이벤트 종목 분석</div>
        <div class="loading-spinner"></div>
        <div class="loading-status">서버 연결 및 데이터 로딩 중...</div>
        <div class="loading-bar-track">
          <div class="loading-bar-fill"></div>
        </div>
      </div>
    </div>
  </body>
</html>
